name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TASK: go tool -modfile=tools/go.mod task
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Go module + build cache, uv cache and the pnpm store are cached by the setup actions;
      # the keys hash every lockfile, so tool upgrades invalidate them too.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, cache-dependency-glob: uv.lock }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }

      - run: $TASK setup
      - name: Generated code is up to date
        run: $TASK check-gen
      - name: No breaking API changes
        if: github.event_name == 'pull_request'
        run: go tool -modfile=tools/go.mod buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
      - run: $TASK lint
      - run: $TASK test
      - run: $TASK test:integration

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
