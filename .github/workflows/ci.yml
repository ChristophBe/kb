name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TASK: go tool -modfile=tools/go.mod task
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      # Go module + build cache, uv cache and the pnpm store are cached by the setup actions;
      # the keys hash every lockfile, so tool upgrades invalidate them too.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, cache-dependency-glob: uv.lock }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }

      - run: $TASK setup
      - name: Generated code is up to date
        run: $TASK check-gen
      - name: No breaking API changes
        if: github.event_name == 'pull_request'
        run: go tool -modfile=tools/go.mod buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
      - run: $TASK lint
      - run: $TASK test
      - run: $TASK test:integration

  # The release images (deploy/images.json), built for amd64 without pushing.
  # The helm job installs them from the artifacts.
  images:
    # images.yml declares packages: write for its push; it stays off here.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    with:
      artifact: true

  # The Helm chart (deploy/helm/kb): lint, install on kind with the dev
  # infrastructure and the images of this run, then the e2e smoke test against
  # the release through its Ingress (docs/operations/kubernetes.md).
  helm:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLUSTER: kb
      PUBLIC_URL: http://kb.localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: azure/setup-helm@v5
        with: { version: v4.1.3 }

      - name: Lint
        run: |
          helm lint --strict deploy/helm/kb --set infra.enabled=true
          helm lint --strict deploy/helm/kb --set oidc.issuer=https://id.example.com --set oidc.jwksUrl=https://id.example.com/keys --set postgres.host=db --set s3.endpoint=s3.example.com

      # The Ingress controller listens on the node's port 80, published as 8000.
      - name: Kind config
        run: |
          cat > "$RUNNER_TEMP/kind.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - { containerPort: 80, hostPort: 8000, listenAddress: 127.0.0.1 }
          EOF
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: ${{ env.CLUSTER }}
          config: ${{ runner.temp }}/kind.yaml
      - name: Traefik
        run: |
          helm install traefik traefik --repo https://traefik.github.io/charts --version 42.0.0 \
            -n traefik --create-namespace \
            --set ports.web.hostPort=80 --set service.enabled=false --set ingressClass.isDefaultClass=true --wait

      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Load the images into kind
        run: |
          for tar in "$RUNNER_TEMP"/images/*/image.tar; do
            kind load image-archive --name "$CLUSTER" "$tar"
          done

      - name: Install
        run: |
          helm install kb deploy/helm/kb -n kb --create-namespace \
            --set infra.enabled=true \
            --set publicUrl="$PUBLIC_URL" \
            --set image.tag=dev \
            --set components.llm-service.env.KB_LLM_PROVIDER=fake \
            --set components.chat-service.env.KB_RAG_MIN_SCORE=-1 \
            --wait --timeout 10m

      # Go's resolver doesn't map *.localhost to the loopback address by itself.
      - run: echo "127.0.0.1 kb.localhost s3.kb.localhost" | sudo tee -a /etc/hosts
      - name: Smoke test
        env:
          KB_E2E_GATEWAY: ${{ env.PUBLIC_URL }}
        run: go tool -modfile=tools/go.mod task e2e

      - name: Cluster state
        if: failure()
        run: |
          kubectl get all,ingress,pvc -A
          kubectl -n kb describe pods
          for p in $(kubectl -n kb get pods -o name); do
            echo "===== $p"
            kubectl -n kb logs "$p" --all-containers --prefix --tail=300 || true
          done

  # Upload → processing → RAG chat against the composed stack (fake LLM provider).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod task e2e

  # Whether a change touches the web UI, for the browser job.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ui:
              - apps/**
              - platform/ui/**
              - modules/*/ui/**
              - tests/browser/**
              - pnpm-lock.yaml
              - .github/workflows/ci.yml

  # Playwright (Chromium) against the composed stack with the web shell: sign-in
  # through Dex, upload, cited chat, a module disabled in the runtime config,
  # ownership. Only for UI changes; a skipped job counts as passed, so it can
  # still be a required check.
  browser:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter @kb/browser-tests
      # Each Playwright release needs its own browser build; the catalog pins the version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @kb/browser-tests exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @kb/browser-tests exec playwright install --with-deps chromium
      - name: Chromium system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @kb/browser-tests exec playwright install-deps chromium
      - run: go tool -modfile=tools/go.mod task e2e:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 14
