name: images

# Builds the image of every component listed in deploy/images.json (generated
# from the module manifests by `task gen`) and, for releases, pushes it to
# ghcr.io/christophbe/kb-<component>:<version> (docs/operations/images.md).
# Called by ci.yml (build only) and by release.yml once a version is released;
# run it by hand to republish a released version.
on:
  workflow_call:
    inputs:
      version:
        description: KB_VERSION baked into the images (no `v`), also the image tag when pushing.
        type: string
        default: dev
      push:
        description: Push the images to GHCR (the caller grants packages write).
        type: boolean
        default: false
      latest:
        description: Also move the `latest` tag (only for the newest release).
        type: boolean
        default: false
      platforms:
        type: string
        default: linux/amd64
  workflow_dispatch:
    inputs:
      version:
        description: Released version to rebuild and push from tag v<version>, e.g. 0.3.1
        type: string
        required: true
      latest:
        description: Also move the `latest` tag (only for the newest release)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.read.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || '' }}
      - id: read
        run: echo "images=$(jq -c '{include}' deploy/images.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    env:
      # A dispatch always pushes, for both platforms.
      PUSH: ${{ github.event_name == 'workflow_dispatch' || inputs.push }}
      PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && 'linux/amd64,linux/arm64' || inputs.platforms }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || '' }}
      # Python and web images build under emulation for arm64; Go cross-compiles.
      - uses: docker/setup-qemu-action@v3
        if: contains(env.PLATFORMS, 'arm64')
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          {
            echo "tags<<EOF"
            echo "$IMAGE:$VERSION"
            if [ "$LATEST" = "true" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            ${{ matrix.build_args }}
            KB_VERSION=${{ inputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          # Links the package to this repository on GHCR (access, README, source).
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # One cache per component; PR builds read the cache main's builds write.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
