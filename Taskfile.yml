# Single entry point for every workflow. Run `task --list`.
# Without a global install: go tool -modfile=tools/go.mod task <name>
version: "3"

vars:
  GOTOOL: go tool -modfile=tools/go.mod
  # The same, usable from another working directory.
  GOTOOL_ABS: go tool -modfile={{.ROOT_DIR}}/tools/go.mod
  # Python components with their own tests (each is run with its own rootdir).
  PY_COMPONENTS:
    sh: for d in platform/python modules/*/service modules/*/worker; do [ -f "$d/pyproject.toml" ] && echo "$d"; done; true

tasks:
  setup:
    desc: Install all dependencies (Go, Python, Node).
    cmds:
      - go mod download
      - go -C tools mod download
      - uv sync --all-packages
      - pnpm install
      - "{{.GOTOOL}} lefthook install"

  gen:
    desc: Run all code generation (module wiring, protobuf, SQL).
    cmds:
      - task: gen:modules
      - task: gen:proto
      - task: gen:sql

  gen:modules:
    desc: Generate wiring from modules/*/module.yaml.
    cmds:
      - go -C tools run ./modgen -root ..

  gen:proto:
    desc: Generate Go, Python and TypeScript code from protobuf.
    cmds:
      - "{{.GOTOOL}} buf lint"
      - for: { var: TEMPLATES }
        cmd: "{{.GOTOOL}} buf generate --template {{.ITEM}}"
    vars:
      TEMPLATES:
        sh: ls platform/buf.gen.yaml modules/*/buf.gen.yaml

  gen:sql:
    desc: Generate typed Go database access with sqlc.
    cmds:
      - for: { var: CONFIGS }
        cmd: cd {{dir .ITEM}} && go tool -modfile={{relPath (dir .ITEM) "tools/go.mod"}} sqlc generate
    vars:
      CONFIGS:
        sh: ls modules/*/service/sqlc.yaml

  lint:
    desc: Lint and type-check everything.
    cmds:
      - "{{.GOTOOL}} buf lint"
      - go vet ./...
      - go vet -tags integration ./...
      - go -C tools vet ./...
      - "{{.GOTOOL}} golangci-lint run ./..."
      - cd tools && go tool golangci-lint run ./...
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run pyright
      - uv run lint-imports
      - pnpm exec biome check .
      - pnpm -r typecheck
      # The chart with external infrastructure and with infra.enabled (CI runners have Helm).
      - |
        if command -v helm >/dev/null; then
          helm lint --strict deploy/helm/kb --set infra.enabled=true
          helm lint --strict deploy/helm/kb --set oidc.issuer=https://id.example.com --set oidc.jwksUrl=https://id.example.com/keys --set postgres.host=db --set s3.endpoint=s3.example.com
        else
          echo "helm not installed: skipping helm lint"
        fi

  fmt:
    desc: Format all code.
    cmds:
      - gofmt -w platform modules tools
      - uv run ruff format .
      - uv run ruff check --fix .
      - pnpm exec biome check --write .

  test:
    desc: Run all unit tests and fail if a component drops below its coverage minimum.
    cmds:
      - task: test:go
      - task: test:py
      - task: test:ts
      - task: test:boundaries

  test:go:
    desc: Go unit tests with per-component coverage minimums.
    vars:
      # <go module dir> <packages> <minimum % of statements>, generated sqlc code excluded.
      # Raise a minimum when coverage improves; lowering one needs a reason in the PR.
      MINIMUMS: |
        .     ./platform/go/...              5
        .     ./modules/document/service/... 30
        .     ./modules/ingestion/service/... 40
        tools ./modgen/...                   65
    cmds:
      - mkdir -p .gocover
      - |
        status=0
        while read -r mod pkgs min; do
          [ -n "$mod" ] || continue
          name=$(echo "$pkgs" | tr -c 'a-z0-9\n' '_')
          go -C "$mod" test -coverprofile="{{.ROOT_DIR}}/.gocover/$name.out" "$pkgs" || { status=1; continue; }
          grep -vE '/internal/store/(db|models|querier|copyfrom|[a-z_]+\.sql)\.go:' ".gocover/$name.out" > ".gocover/$name.src.out"
          pct=$(go -C "$mod" tool cover -func="{{.ROOT_DIR}}/.gocover/$name.src.out" | awk '/^total:/ { sub("%", "", $NF); print $NF }')
          if awk -v p="$pct" -v m="$min" 'BEGIN { exit !(p < m) }'; then
            echo "FAIL coverage $pkgs: $pct% < $min%"; status=1
          else
            echo "ok   coverage $pkgs: $pct% (min $min%)"
          fi
        done <<'EOF'
        {{.MINIMUMS}}
        EOF
        exit $status

  test:py:
    desc: Python unit tests with per-component coverage minimums.
    vars:
      # <component> <minimum % of lines>; every component in PY_COMPONENTS needs an entry.
      MINIMUMS: |
        platform/python          5
        modules/chat/service     70
        modules/llm/service      80
        modules/ingestion/worker 75
    cmds:
      - for: { var: PY_COMPONENTS }
        cmd: |
          min=$(echo '{{.MINIMUMS}}' | awk -v c="{{.ITEM}}" '$1 == c { print $2 }')
          [ -n "$min" ] || { echo "no coverage minimum for {{.ITEM}} in Taskfile test:py"; exit 1; }
          uv run pytest -q -m "not integration" --rootdir {{.ITEM}} {{.ITEM}} --cov={{.ITEM}}/src --cov-report=term:skip-covered --cov-fail-under="$min"

  test:ts:
    desc: TypeScript unit tests (Vitest) with the coverage thresholds from vitest.config.ts.
    cmds:
      - pnpm exec vitest run --coverage

  test:boundaries:
    desc: Check that the module-boundary lint rules catch the violations in tools/modgen/testdata/boundaries.
    vars:
      FIXTURE: tools/modgen/testdata/boundaries
    cmds:
      - |
        set -e
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        cp -R {{.FIXTURE}}/. "$tmp"
        go -C tools run ./modgen -root "$tmp" >/dev/null
        status=0
        # expect <linter> <files> <output>: the output must name exactly these files (never an ok.* file).
        expect() {
          got=$(printf '%s\n' "$3" | grep -oE '[a-z_/]*(bad|ok)\.(go|py|ts)' | sort -u | tr '\n' ' ')
          if [ "$got" = "$2" ]; then echo "ok   $1 rejects: $got"; else echo "FAIL $1: want $2, got: $got"; printf '%s\n' "$3"; status=1; fi
        }
        go_out=$(cd "$tmp" && {{.GOTOOL_ABS}} golangci-lint run --enable-only depguard ./... 2>&1 || true)
        expect go "modules/search/service/bad/bad.go modules/tags/service/bad/bad.go platform/go/bad/bad.go " "$go_out"
        py_path=$(ls -d "$tmp"/modules/*/*/src "$tmp"/modules/*/api/python/src "$tmp"/platform/python/src | tr '\n' ':')
        py_out=$(PYTHONPATH="$py_path" uv run lint-imports --config "$tmp/.importlinter" 2>&1 || true)
        py_out=$(printf '%s\n' "$py_out" | sed -E 's/kb_(search|tags|platform)\.(bad|ok)/\1\/\2.py/')
        expect python "platform/bad.py search/bad.py tags/bad.py " "$py_out"
        ts_out=$(cd "$tmp" && {{.ROOT_DIR}}/node_modules/.bin/biome lint . 2>&1 || true)
        expect ts "modules/search/ui/src/bad.ts modules/search/ui/src/subpath/bad.ts modules/tags/ui/src/bad.ts platform/ui/kit/src/bad.ts " "$ts_out"
        exit $status

  test:integration:
    desc: Integration tests against a real Postgres (needs Docker; not part of `test`).
    cmds:
      - go test -tags integration -count=1 ./modules/document/service/internal/... ./modules/ingestion/service/internal/store/...
      - uv run pytest -q -m integration --rootdir modules/chat/service modules/chat/service

  e2e:
    desc: >-
      End-to-end smoke test (needs Docker; not part of `test`): builds and starts the stack as
      compose project kb-e2e on ports 21xxx, uploads a file and chats about it, tears it down.
      With KB_E2E_GATEWAY set it tests that running stack instead (e.g. a Helm release).
    vars:
      PROJECT: '{{.KB_E2E_PROJECT | default "kb-e2e"}}'
    cmds:
      # The test tears the stack down itself; this also covers a killed test binary.
      - defer: docker compose -p {{.PROJECT}} -f compose.yaml -f tests/e2e/compose.e2e.yaml down --volumes --remove-orphans --timeout 10 >/dev/null 2>&1 || true
      - go vet -tags e2e ./tests/e2e/...
      - go test -tags e2e -count=1 -timeout 15m -v ./tests/e2e/... {{.CLI_ARGS}}

  e2e:browser:
    desc: >-
      Browser tests (Playwright, Chromium; needs Docker; not part of `test`): builds and starts the
      stack with the web shell as compose project kb-browser on ports 22xxx, signs in through Dex
      and drives the UI, tears it down (KB_E2E_KEEP=1 keeps it). With KB_E2E_WEB set it tests that
      running web shell instead. Arguments after -- go to `playwright test`.
    vars:
      PROJECT: '{{.KB_E2E_PROJECT | default "kb-browser"}}'
      GATEWAY_PORT: '{{.KB_GATEWAY_PORT | default "22080"}}'
      S3_PORT: '{{.KB_E2E_S3_PORT | default "22333"}}'
      WEB_PORT: '{{.KB_WEB_PORT | default "22300"}}'
      DEX_PORT: '{{.KB_DEX_PORT | default "22556"}}'
      # The override of `task e2e`: only the gateway, S3, Dex and the web shell are published.
      COMPOSE: docker compose -p {{.PROJECT}} -f compose.yaml -f tests/e2e/compose.e2e.yaml
    env:
      KB_LLM_PROVIDER: fake
      # Hash embeddings score like noise; keep every retrieved chunk.
      KB_RAG_MIN_SCORE: "-1"
      KB_GATEWAY_PORT: "{{.GATEWAY_PORT}}"
      KB_E2E_S3_PORT: "{{.S3_PORT}}"
      KB_WEB_PORT: "{{.WEB_PORT}}"
      KB_DEX_PORT: "{{.DEX_PORT}}"
      KB_API_BASE_URL: http://localhost:{{.GATEWAY_PORT}}
      KB_S3_PUBLIC_ENDPOINT: localhost:{{.S3_PORT}}
      KB_OIDC_ISSUER: http://localhost:{{.DEX_PORT}}/dex
    preconditions:
      - sh: '[ "{{.PROJECT}}" != kb ]'
        msg: "KB_E2E_PROJECT must not be kb: the run deletes the project's volumes"
    cmds:
      - defer: |
          [ -n "$KB_E2E_WEB" ] && exit 0
          {{if .EXIT_CODE}}{{.COMPOSE}} ps --all; {{.COMPOSE}} logs --no-color --timestamps --tail 300{{end}}
          [ -n "$KB_E2E_KEEP" ] && { echo "KB_E2E_KEEP is set, leaving compose project {{.PROJECT}} running"; exit 0; }
          {{.COMPOSE}} down --volumes --remove-orphans --timeout 10 >/dev/null 2>&1 || true
      - pnpm --filter @kb/browser-tests exec playwright install chromium
      - '[ -n "$KB_E2E_WEB" ] || {{.COMPOSE}} up --detach --build --wait --wait-timeout 600'
      - pnpm --filter @kb/browser-tests exec playwright test {{.CLI_ARGS}}

  test:fast:
    desc: Unit tests without coverage (pre-push hook).
    cmds:
      - go test ./...
      - go -C tools test ./...
      - for: { var: PY_COMPONENTS }
        cmd: uv run pytest -q -m "not integration" --rootdir {{.ITEM}} {{.ITEM}}
      - pnpm exec vitest run

  check-gen:
    desc: Fail if generated code is out of date.
    cmds:
      - task: gen
      - git diff --exit-code -- . ':(exclude)uv.lock' ':(exclude)pnpm-lock.yaml'

  ci:
    desc: Everything CI runs.
    cmds:
      - task: check-gen
      - task: lint
      - task: test

  up:
    desc: Build and start the whole stack (pass compose flags after --, e.g. -- --profile ollama).
    cmds:
      - docker compose {{.CLI_ARGS}} up -d --build --wait

  down:
    desc: Stop the stack (add -- -v to delete volumes).
    cmds:
      - docker compose down {{.CLI_ARGS}}

  logs:
    desc: Follow logs (optionally of one service).
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  dev:
    desc: Start the stack with hot reload (docker compose watch).
    cmds:
      - docker compose watch

  web:
    desc: Run the web shell with Vite against the running stack.
    cmds:
      - pnpm dev

  site:
    desc: Run the marketing site (apps/site, published to GitHub Pages) with Vite.
    cmds:
      - pnpm site
