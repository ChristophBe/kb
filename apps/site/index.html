<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowcelium: the knowledge backbone of your organization</title>
    <meta
      name="description"
      content="Knowcelium is an open-source, modular knowledge backbone you run yourself. It connects your organization's documents and systems, answers with sources, and grows with every module you add."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Knowcelium: the knowledge backbone of your organization" />
    <meta
      property="og:description"
      content="Connect your organization's documents and systems, search them by meaning and get answers with sources. Open source, on your own infrastructure."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#f4f3ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0e0b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Applies the saved theme (@kb/ui theme.ts) before first paint, so a pinned theme doesn't flash.
      try {
        const theme = localStorage.getItem("kb.theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body class="bg-canvas text-fg antialiased">
    <div id="root"><!--app--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
