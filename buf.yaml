# Buf workspace: every module owns its contract under modules/<id>/proto.
version: v2
modules:
  - path: platform/proto
  - path: modules/chat/proto
  - path: modules/document/proto
  - path: modules/ingestion/proto
  - path: modules/llm/proto
lint:
  use:
    - STANDARD
breaking:
  use:
    - FILE
  # The one-off kb.* -> knowcel.* package rename (#188): the old files are
  # intentionally gone. Drop these once the rename is on main.
  ignore:
    - modules/chat/proto/kb
    - modules/document/proto/kb
    - modules/ingestion/proto/kb
    - modules/llm/proto/kb
    - platform/proto/kb
