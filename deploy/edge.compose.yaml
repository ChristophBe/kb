# Browser-facing entry points: the gRPC-Web gateway and the web shell.
services:
  envoy:
    image: envoyproxy/envoy:v1.40-latest
    # entrypoint.sh fills in the OIDC settings, then starts Envoy.
    entrypoint: ["/etc/envoy/entrypoint.sh"]
    command: ["--log-level", "warn"]
    environment:
      KNOWCEL_OIDC_ISSUER: ${KNOWCEL_OIDC_ISSUER:-http://localhost:5556/dex}
      KNOWCEL_OIDC_JWKS_URL: ${KNOWCEL_OIDC_JWKS_URL:-http://dex:5556/dex/keys}
      KNOWCEL_OIDC_AUDIENCES: ${KNOWCEL_OIDC_AUDIENCES:-kb-web,kb-cli}
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./envoy/entrypoint.sh:/etc/envoy/entrypoint.sh:ro
    ports: ["${KNOWCEL_GATEWAY_PORT:-8080}:8080"]

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
      args: { KNOWCEL_VERSION: "${KNOWCEL_VERSION:-dev}" }
    environment:
      KNOWCEL_API_BASE_URL: ${KNOWCEL_API_BASE_URL:-http://localhost:8080}
      KNOWCEL_ENABLED_MODULES: ${KNOWCEL_ENABLED_MODULES:-}
      KNOWCEL_OIDC_ISSUER: ${KNOWCEL_OIDC_ISSUER:-http://localhost:5556/dex}
      KNOWCEL_OIDC_CLIENT_ID: ${KNOWCEL_OIDC_CLIENT_ID:-kb-web}
      KNOWCEL_BRANDING_FILE: ${KNOWCEL_BRANDING_DIR:+/branding/branding.json}
    volumes:
      - ${KNOWCEL_BRANDING_DIR:-./branding}:/branding:ro
    ports: ["${KNOWCEL_WEB_PORT:-3000}:80"]
    depends_on: [envoy]
