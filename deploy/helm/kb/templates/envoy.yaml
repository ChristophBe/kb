{{- /*
The gRPC-Web gateway. files/envoy.yaml is generated by modgen (the same
config compose runs); its ${KB_OIDC_*} placeholders are filled in here, as
deploy/envoy/entrypoint.sh does for compose.
*/ -}}
{{- $jwks := include "kb.oidcJwksUrl" . -}}
{{- $u := urlParse $jwks -}}
{{- if not (has $u.scheme (list "http" "https")) -}}
{{- fail (printf "oidc.jwksUrl must be an http(s) URL: %s" $jwks) -}}
{{- end -}}
{{- $host := regexReplaceAll ":[0-9]+$" $u.host "" -}}
{{- $port := ternary (regexFind "[0-9]+$" $u.host) (ternary "443" "80" (eq $u.scheme "https")) (regexMatch ":[0-9]+$" $u.host) -}}
{{- $config := .Files.Get "files/envoy.yaml"
  | replace "${KB_OIDC_ISSUER}" (include "kb.oidcIssuer" .)
  | replace "${KB_OIDC_AUDIENCES}" (join "," .Values.oidc.audiences)
  | replace "${KB_OIDC_JWKS_URL}" $jwks
  | replace "${KB_OIDC_JWKS_CLUSTER}" (printf "oidc_%s" $u.scheme)
  | replace "${KB_OIDC_JWKS_HOST}" $host
  | replace "${KB_OIDC_JWKS_PORT}" $port -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy
  labels: {{- include "kb.labels" (dict "root" . "component" "envoy") | nindent 4 }}
data:
  envoy.yaml: |{{- $config | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  labels: {{- include "kb.labels" (dict "root" . "component" "envoy") | nindent 4 }}
spec:
  replicas: {{ .Values.envoy.replicas }}
  selector:
    matchLabels: {{- include "kb.selectorLabels" (dict "root" . "component" "envoy") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kb.labels" (dict "root" . "component" "envoy") | nindent 8 }}
      annotations:
        # Roll the pods when the routes or the OIDC settings change.
        checksum/config: {{ $config | sha256sum }}
    spec:
      {{- with include "kb.podDefaults" . | trim }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: envoy
          image: {{ .Values.envoy.image }}
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.envoy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
              readOnly: true
      volumes:
        - name: config
          configMap: { name: envoy }
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  labels: {{- include "kb.labels" (dict "root" . "component" "envoy") | nindent 4 }}
spec:
  selector: {{- include "kb.selectorLabels" (dict "root" . "component" "envoy") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
