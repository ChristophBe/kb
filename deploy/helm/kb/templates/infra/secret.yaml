{{- /* The dev credentials, as in deploy/infra.compose.yaml. Without infra.enabled the operator creates this Secret. */ -}}
{{- if .Values.infra.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.infra.secretName }}
  labels: {{- include "kb.labels" (dict "root" . "component" "infra") | nindent 4 }}
type: Opaque
stringData:
  postgres-user: kb
  postgres-password: kb
  nats-url: nats://nats:4222
  s3-access-key: kb
  s3-secret-key: kb-secret-key
  # SeaweedFS's identities (deploy/seaweedfs/s3.json).
  s3.json: |
    {"identities": [{"name": "kb", "credentials": [{"accessKey": "kb", "secretKey": "kb-secret-key"}],
      "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
{{- end }}
