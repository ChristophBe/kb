{{- /* The web shell (nginx); 40-runtime-config.sh writes config.json from the env. */ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "kb.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "kb.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kb.labels" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- with include "kb.podDefaults" . | trim }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: web
          image: {{ include "kb.image" (dict "root" . "repository" .Values.web.image.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The Ingress sends the gRPC paths on the same host to Envoy.
            - name: KB_API_BASE_URL
              value: {{ trimSuffix "/" .Values.publicUrl | quote }}
            - name: KB_ENABLED_MODULES
              value: {{ .Values.web.enabledModules | quote }}
            - name: KB_OIDC_ISSUER
              value: {{ include "kb.oidcIssuer" . | quote }}
            - name: KB_OIDC_CLIENT_ID
              value: {{ .Values.oidc.clientId | quote }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /config.json, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /config.json, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "kb.labels" (dict "root" . "component" "web") | nindent 4 }}
spec:
  selector: {{- include "kb.selectorLabels" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
