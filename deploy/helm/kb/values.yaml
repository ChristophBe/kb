# Code generated by modgen from modules/*/module.yaml and
# tools/modgen/templates/helm/values.yaml.tmpl. DO NOT EDIT; change the
# template (or a module.yaml) and run `task gen`.
# Install guide: docs/operations/kubernetes.md.

# Where browsers reach the Ingress host (scheme, host and port, no path). The
# web shell calls the API there, and the dev Dex (infra.enabled) uses
# <publicUrl>/dex as its issuer.
publicUrl: http://kb.localhost

image:
  # Images are <registry>/<repository>:<tag> (docs/operations/images.md).
  registry: ghcr.io/christophbe
  # Defaults to the chart's appVersion, the kb release it was made for.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Shared infrastructure. By default the chart connects to external servers
# (managed Postgres with pgvector, NATS with JetStream, an S3 service); their
# credentials come from the Secret infra.secretName with the keys
# postgres-user, postgres-password, nats-url, s3-access-key, s3-secret-key
# (URL-safe or percent-encoded, they are used inside URLs).
infra:
  # Deploy single-instance Postgres, NATS, SeaweedFS (S3) and the dev Dex in
  # the release, with known credentials. For development and tests only.
  enabled: false
  # Created by the chart with the dev credentials when infra.enabled.
  secretName: kb-infra
  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
  images:
    postgres: pgvector/pgvector:pg17
    nats: nats:2.12-alpine
    s3: chrislusf/seaweedfs:4.00
    dex: dexidp/dex:v2.44.0
    # Init containers wait for the servers with nc.
    wait: busybox:1.37

# External servers (ignored with infra.enabled).
postgres:
  host: ""
  port: 5432
  database: kb
  # disable | require | verify-ca | verify-full
  sslmode: require
s3:
  # host:port the services use.
  endpoint: ""
  # host:port browsers upload to through presigned URLs; defaults to endpoint.
  # With infra.enabled it is s3.<publicUrl host>, served by the Ingress.
  publicEndpoint: ""
  useSSL: true
  region: us-east-1
  bucket: documents

# OIDC issuer whose tokens Envoy accepts (docs/adr/0009). Required unless
# infra.enabled, which defaults them to the dev Dex.
oidc:
  # The tokens' iss claim, also where browsers sign in.
  issuer: ""
  # Where Envoy fetches the signing keys (http or https).
  jwksUrl: ""
  audiences: [kb-web, kb-cli]
  # The web shell's client id at the issuer (authorization code with PKCE).
  clientId: kb-web

ingress:
  enabled: true
  className: ""
  annotations: {}
  # The host of publicUrl.
  host: kb.localhost
  # e.g. [{secretName: kb-tls, hosts: [kb.example.com]}]
  tls: []

# Local model server for the llm module (KB_LLM_PROVIDER=ollama), reachable as
# http://ollama:11434. The pull job downloads the models after install.
ollama:
  enabled: false
  image: ollama/ollama:0.12.6
  models: [llama3.2, nomic-embed-text]
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  resources: {}

# The gRPC-Web gateway (deploy/envoy/envoy.yaml, generated from the modules).
envoy:
  image: envoyproxy/envoy:v1.36-latest
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

# The web shell with every module UI.
web:
  replicas: 1
  image:
    repository: kb-web
  # Module ids to show (comma-separated); empty shows all.
  enabledModules: ""
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 64Mi }

# Only the release's own pods may connect to the module services, which trust
# the x-kb-user header (needs a CNI that enforces NetworkPolicy).
networkPolicy:
  enabled: true

# OpenTelemetry: the OTLP endpoint every module component sends traces to
# (KB_OTEL_ENDPOINT); empty leaves tracing off.
otel:
  endpoint: ""

podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# One entry per module component (modules/*/module.yaml). env holds KB_*
# settings (README, .env.example); extraEnv takes full EnvVar entries, e.g. a
# secretKeyRef for KB_ANTHROPIC_API_KEY. Components with infra get their
# connection settings from the values above, peers their KB_<MODULE>_ADDR.
components:
  # chat-service (chat module, python, gRPC :9003; uses postgres)
  chat-service:
    enabled: true
    replicas: 1
    image:
      repository: kb-chat-service
    env: {}
    extraEnv: []
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 1Gi }
  # document-service (document module, go, gRPC :9001; uses postgres, s3)
  document-service:
    enabled: true
    replicas: 1
    image:
      repository: kb-document-service
    env:
      KB_ALLOWED_CONTENT_TYPES: "application/pdf,text/*,application/json,application/yaml,application/x-yaml"
      KB_MAX_UPLOAD_BYTES: "52428800"
    extraEnv: []
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 256Mi }
  # ingestion-service (ingestion module, go, gRPC :9002; uses postgres, nats)
  ingestion-service:
    enabled: true
    replicas: 1
    image:
      repository: kb-ingestion-service
    env: {}
    extraEnv: []
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 256Mi }
  # ingestion-worker (ingestion module, python; uses nats)
  ingestion-worker:
    enabled: true
    replicas: 1
    image:
      repository: kb-ingestion-worker
    env: {}
    extraEnv: []
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 1Gi }
  # llm-service (llm module, python, gRPC :9004)
  llm-service:
    enabled: true
    replicas: 1
    image:
      repository: kb-llm-service
    env:
      KB_LLM_PROVIDER: "ollama"
      KB_OLLAMA_URL: "http://ollama:11434"
    extraEnv: []
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 1Gi }
