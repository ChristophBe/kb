# Shared infrastructure. Each module owns its own schema / bucket / stream in
# these servers; nothing here is module-specific.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: kb
    ports: ["5432:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kb"]
      interval: 2s
      retries: 30

  # S3-compatible object storage. Browsers upload to it directly through
  # presigned URLs, so its port must be reachable from the host.
  s3:
    image: chrislusf/seaweedfs:4.51
    command: server -ip.bind=0.0.0.0 -dir=/data -filer -s3 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - s3:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/status"]
      interval: 2s
      retries: 60

  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222"]
    volumes: [nats:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      retries: 30

  # Dev OIDC identity provider (users alice and bob, password "password").
  # Envoy fetches its signing keys at dex:5556; browsers and tests reach it at
  # the issuer URL, so the published port must match KB_OIDC_ISSUER.
  dex:
    image: dexidp/dex:v2.46.1
    command: ["dex", "serve", "/etc/dex/config.yaml.tpl"]
    environment:
      KB_OIDC_ISSUER: ${KB_OIDC_ISSUER:-http://localhost:5556/dex}
      KB_WEB_PORT: ${KB_WEB_PORT:-3000}
      KB_WEB_DEV_PORT: ${KB_WEB_DEV_PORT:-5173}
    ports: ["${KB_DEX_PORT:-5556}:5556"]
    volumes:
      - dex:/var/dex
      - ./dex/config.yaml.tpl:/etc/dex/config.yaml.tpl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:5556/dex/healthz"]
      interval: 2s
      retries: 30

  # Observability (`--profile observability`, docs/operations/observability.md).
  # Services export to the collector once KB_OTEL_ENDPOINT points at it; it
  # forwards traces to Jaeger, whose UI is on KB_JAEGER_PORT. Prometheus
  # scrapes every component's /metrics (docs/metrics.md); its UI is on
  # KB_PROMETHEUS_PORT.
  otel-collector:
    image: otel/opentelemetry-collector:0.164.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/collector.yaml"]
    ports: ["${KB_OTEL_GRPC_PORT:-4317}:4317"]
    volumes: [./otel/collector.yaml:/etc/otelcol/collector.yaml:ro]
    depends_on: [jaeger]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observability]
    ports: ["${KB_JAEGER_PORT:-16686}:16686"]

  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: [observability]
    # The scrape targets are generated from the module manifests (task gen).
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports: ["${KB_PROMETHEUS_PORT:-9090}:9090"]

volumes:
  postgres:
  s3:
  nats:
  dex:
  prometheus:
