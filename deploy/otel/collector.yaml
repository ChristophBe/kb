# OpenTelemetry collector of the `observability` compose profile
# (docs/operations/observability.md). Services send OTLP here when
# KB_OTEL_ENDPOINT=http://otel-collector:4317; the collector batches the spans
# and forwards them to Jaeger. Add a pipeline per signal (metrics, logs) below.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger]
