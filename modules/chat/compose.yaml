services:
  chat-service:
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args: { PACKAGE: knowcel-chat-service, KNOWCEL_VERSION: "${KNOWCEL_VERSION:-dev}" }
    environment:
      KNOWCEL_LOG_LEVEL: ${KNOWCEL_LOG_LEVEL:-INFO}
      KNOWCEL_OTEL_ENDPOINT: ${KNOWCEL_OTEL_ENDPOINT:-}
      KNOWCEL_DATABASE_URL: postgresql+asyncpg://kb:kb@postgres:5432/kb
      KNOWCEL_DOCUMENT_ADDR: document-service:9001
      KNOWCEL_LLM_ADDR: llm-service:9004
      KNOWCEL_RAG_MIN_SCORE: ${KNOWCEL_RAG_MIN_SCORE:-0.5}
    # gRPC and Prometheus /metrics (docs/metrics.md).
    ports: ["9003:9003", "9103:9103"]
    # Infrastructure only: other modules are soft dependencies (docs/architecture/module.md).
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "knowcel_platform.healthcheck", "9003"]
      interval: 2s
      retries: 30
    develop:
      watch:
        - { action: sync+restart, path: ./service/src, target: /app/modules/chat/service/src }
        - { action: sync+restart, path: ./migrations, target: /app/modules/chat/migrations }
        - { action: sync+restart, path: ../../platform/python/src, target: /app/platform/python/src }
        - { action: sync+restart, path: ../../docs/user-manual, target: /app/docs/user-manual }
