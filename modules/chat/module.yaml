# Module manifest — consumed by tools/modgen (`task gen`).
id: chat
title: Chat
description: Conversations with retrieval-augmented answers over the knowledge base.
services:
  - name: chat-service
    language: python
    port: 9003
    metrics_port: 9103
    infra: [postgres]
    grpc_services: [knowcel.chat.v1.ChatService]
ui: "@knowcel/module-chat"
# Retrieval (SearchChunks) and generation/embeddings. iam tells the caller's
# teams, which a conversation can be limited to; while it is down, only
# "all documents" works.
depends_on: [document, llm, iam]
