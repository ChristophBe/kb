# Module manifest — consumed by tools/modgen (`task gen`).
id: chat
title: Chat
description: Conversations with retrieval-augmented answers over the knowledge base.
services:
  - name: chat-service
    language: python
    port: 9003
    infra: [postgres]
    grpc_services: [kb.chat.v1.ChatService]
ui: "@kb/module-chat"
# Retrieval (SearchChunks) and generation/embeddings.
depends_on: [document, llm]
