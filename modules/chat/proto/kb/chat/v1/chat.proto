syntax = "proto3";

package kb.chat.v1;

import "google/protobuf/timestamp.proto";
import "kb/common/v1/common.proto";

option go_package = "github.com/christoph/kb/modules/chat/api/go/chatv1;chatv1";

// ChatService manages conversations and answers questions, optionally
// grounded in the knowledge base (retrieval-augmented generation).
service ChatService {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  // UpdateConversation changes the fields that are set and keeps the others.
  rpc UpdateConversation(UpdateConversationRequest) returns (UpdateConversationResponse);
  // StreamChat appends a user message and streams the assistant's answer.
  rpc StreamChat(StreamChatRequest) returns (stream StreamChatResponse);
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

// How an answer ended. User messages are always complete.
enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_COMPLETE = 1;
  // The user stopped the answer; the text so far is kept.
  MESSAGE_STATUS_STOPPED = 2;
  // A required service failed; the text so far is kept.
  MESSAGE_STATUS_FAILED = 3;
}

// Why an answer failed.
enum ChatErrorCode {
  CHAT_ERROR_CODE_UNSPECIFIED = 0;
  // A required service is unavailable; retrying later may succeed.
  CHAT_ERROR_CODE_UNAVAILABLE = 1;
  // A required service failed for another reason.
  CHAT_ERROR_CODE_INTERNAL = 2;
}

message Citation {
  string document_id = 1;
  string document_title = 2;
  int32 chunk_index = 3;
  string snippet = 4;
  float score = 5;
}

message ChatMessage {
  string id = 1;
  MessageRole role = 2;
  string content = 3;
  repeated Citation citations = 4;
  google.protobuf.Timestamp create_time = 5;
  MessageStatus status = 6;
}

message Conversation {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;
  // The documents answers are grounded in; empty means all documents.
  repeated string document_ids = 5;
  // When the latest message was added; not set while there are no messages.
  google.protobuf.Timestamp last_message_time = 6;
  // The start of the latest message as plain text (Markdown removed), at most
  // 120 characters; empty while there are no messages.
  string last_message_preview = 7;
}

// A list of document ids, wrapped so that an update can tell "keep the scope"
// (not set) from "all documents" (set, but empty).
message DocumentIds {
  repeated string ids = 1;
}

message CreateConversationRequest {
  string title = 1;
  // The documents answers are grounded in; empty means all documents.
  repeated string document_ids = 2;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message GetConversationRequest {
  string id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
  repeated ChatMessage messages = 2;
}

// Conversations come newest first by their latest message; a conversation
// without messages counts from its creation. Renaming or rescoping one does not
// move it.
message ListConversationsRequest {
  kb.common.v1.PageRequest page = 1;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  kb.common.v1.PageResponse page = 2;
}

message DeleteConversationRequest {
  string id = 1;
}

message DeleteConversationResponse {}

message UpdateConversationRequest {
  string id = 1;
  // Must not be empty or blank when set.
  optional string title = 2;
  // Replaces the scope when set; empty ids mean all documents.
  DocumentIds document_ids = 3;
}

message UpdateConversationResponse {
  Conversation conversation = 1;
}

message StreamChatRequest {
  string conversation_id = 1;
  string content = 2;
  // Ground the answer in the knowledge base.
  bool use_knowledge_base = 3;
  // Model id; empty uses the llm module's default.
  string model = 4;
}

message StreamChatResponse {
  oneof event {
    // Retrieved sources, sent once before the first delta.
    Citations citations = 1;
    // A chunk of the answer text.
    string delta = 2;
    // The persisted assistant message, sent last. Its status says how the
    // answer ended.
    ChatMessage message = 3;
    // The answer failed. Sent once, before the message with the failed status.
    ChatError error = 4;
  }
}

message ChatError {
  ChatErrorCode code = 1;
  // A readable reason to show to the user, without technical details.
  string message = 2;
}

message Citations {
  repeated Citation items = 1;
}
