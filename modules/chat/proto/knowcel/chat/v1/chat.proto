syntax = "proto3";

package knowcel.chat.v1;

import "google/protobuf/timestamp.proto";
import "knowcel/common/v1/common.proto";

option go_package = "github.com/ChristophBe/knowcelium/modules/chat/api/go/chatv1;chatv1";

// ChatService manages conversations and answers questions, optionally
// grounded in the knowledge base (retrieval-augmented generation).
service ChatService {
  rpc CreateConversation(CreateConversationRequest) returns (CreateConversationResponse);
  rpc GetConversation(GetConversationRequest) returns (GetConversationResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse);
  // UpdateConversation changes the fields that are set and keeps the others.
  rpc UpdateConversation(UpdateConversationRequest) returns (UpdateConversationResponse);
  // SearchConversations finds conversations by words in their title or in
  // their messages.
  rpc SearchConversations(SearchConversationsRequest) returns (SearchConversationsResponse);
  // StreamChat appends a user message and streams the assistant's answer.
  rpc StreamChat(StreamChatRequest) returns (stream StreamChatResponse);
  // StopChat stops the answer being written in a conversation; the text so far
  // is kept with the status stopped. Disconnecting from StreamChat does not
  // stop the answer, it keeps being written in the background.
  rpc StopChat(StopChatRequest) returns (StopChatResponse);
  // GetPromptTemplates returns the prompts used for answers by default.
  rpc GetPromptTemplates(GetPromptTemplatesRequest) returns (GetPromptTemplatesResponse);
  // UpdatePromptTemplates changes the default prompts for all conversations.
  // Only platform admins may call it (PERMISSION_DENIED otherwise).
  rpc UpdatePromptTemplates(UpdatePromptTemplatesRequest) returns (UpdatePromptTemplatesResponse);
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

// How an answer ended. User messages are always complete.
enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_COMPLETE = 1;
  // The user stopped the answer; the text so far is kept.
  MESSAGE_STATUS_STOPPED = 2;
  // A required service failed; the text so far is kept.
  MESSAGE_STATUS_FAILED = 3;
}

// Why an answer failed.
enum ChatErrorCode {
  CHAT_ERROR_CODE_UNSPECIFIED = 0;
  // A required service is unavailable; retrying later may succeed.
  CHAT_ERROR_CODE_UNAVAILABLE = 1;
  // A required service failed for another reason.
  CHAT_ERROR_CODE_INTERNAL = 2;
}

// A source an answer is grounded in: a chunk of a document, or a section of the
// user manual. Manual citations set manual_page and manual_section instead of
// document_id and chunk_index; their document_title names the page and section.
message Citation {
  string document_id = 1;
  string document_title = 2;
  int32 chunk_index = 3;
  string snippet = 4;
  float score = 5;
  // The manual page, as in /help/<manual_page>.
  string manual_page = 6;
  // The section anchor on that page, as in /help/<manual_page>#<manual_section>.
  string manual_section = 7;
}

message ChatMessage {
  string id = 1;
  MessageRole role = 2;
  string content = 3;
  repeated Citation citations = 4;
  google.protobuf.Timestamp create_time = 5;
  MessageStatus status = 6;
}

message Conversation {
  string id = 1;
  string title = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;
  // The documents answers are grounded in; empty means all documents.
  repeated string document_ids = 5;
  // When the latest message was added; not set while there are no messages.
  google.protobuf.Timestamp last_message_time = 6;
  // The start of the latest message as plain text (Markdown removed), at most
  // 120 characters; empty while there are no messages.
  string last_message_preview = 7;
  // The id of the user who created it (the subject of their token). Output
  // only: a user sees only their own conversations.
  string owner_id = 8;
  // The teams answers are limited to: only documents attached to one of them
  // are used (public documents are not). Empty means all documents the user
  // can read. A team the user has left or that was deleted counts as not
  // chosen; with none left the conversation uses all documents.
  repeated string team_ids = 9;
  // An answer is being written. Output only.
  bool generating = 10;
  // An answer was completed (or failed) while nobody was following it. Cleared
  // when the conversation is fetched with GetConversation. Output only.
  bool completed_unseen = 11;
  // The system prompt of this conversation, a template (see PromptTemplates);
  // empty means the default system prompt.
  string system_prompt = 12;
}

// A list of team ids, wrapped like DocumentIds so that an update can tell
// "keep the teams" (not set) from "all documents" (set, but empty).
message TeamIds {
  repeated string ids = 1;
}

// A list of document ids, wrapped so that an update can tell "keep the scope"
// (not set) from "all documents" (set, but empty).
message DocumentIds {
  repeated string ids = 1;
}

message CreateConversationRequest {
  string title = 1;
  // The documents answers are grounded in; empty means all documents.
  repeated string document_ids = 2;
  // The teams answers are limited to, of which the caller must be a member
  // (PERMISSION_DENIED otherwise); empty means all documents the user can read.
  // Together with document_ids, a document must match both.
  repeated string team_ids = 3;
}

message CreateConversationResponse {
  Conversation conversation = 1;
}

message GetConversationRequest {
  string id = 1;
}

message GetConversationResponse {
  Conversation conversation = 1;
  repeated ChatMessage messages = 2;
}

// Conversations come newest first by their latest message; a conversation
// without messages counts from its creation. Renaming or rescoping one does not
// move it.
message ListConversationsRequest {
  knowcel.common.v1.PageRequest page = 1;
}

message ListConversationsResponse {
  repeated Conversation conversations = 1;
  knowcel.common.v1.PageResponse page = 2;
}

message DeleteConversationRequest {
  string id = 1;
}

message DeleteConversationResponse {}

message UpdateConversationRequest {
  string id = 1;
  // Must not be empty or blank when set.
  optional string title = 2;
  // Replaces the scope when set; empty ids mean all documents.
  DocumentIds document_ids = 3;
  // Replaces the teams when set, with the rules of CreateConversationRequest;
  // empty ids mean all documents the user can read.
  TeamIds team_ids = 4;
  // Replaces the system prompt of the conversation when set; empty resets it
  // to the default. Must be a valid template (INVALID_ARGUMENT otherwise, with
  // the reason in the violation of `system_prompt`). The owner may always set it.
  optional string system_prompt = 5;
}

message UpdateConversationResponse {
  Conversation conversation = 1;
}

// Each word of the query matches words that start with it, regardless of case;
// a conversation matches when its title or one of its messages contains all
// words.
message SearchConversationsRequest {
  // Must not be empty or blank.
  string query = 1;
  // At most this many results; 0 means 20, more than 50 means 50.
  int32 limit = 2;
}

// Title matches come first, then message matches, each group best match first;
// a conversation appears at most once.
message SearchConversationsResponse {
  repeated ConversationMatch results = 1;
}

message ConversationMatch {
  Conversation conversation = 1;
  // An excerpt of the best matching message as plain text; empty when only the
  // title matches.
  string snippet = 2;
}

message StreamChatRequest {
  string conversation_id = 1;
  string content = 2;
  // Ground the answer in the knowledge base.
  bool use_knowledge_base = 3;
  // Model id; empty uses the llm module's default.
  string model = 4;
}

message StopChatRequest {
  string conversation_id = 1;
}

// Sent also when no answer was being written.
message StopChatResponse {}

message StreamChatResponse {
  oneof event {
    // Retrieved sources, sent once before the first delta.
    Citations citations = 1;
    // A chunk of the answer text.
    string delta = 2;
    // The persisted assistant message, sent last. Its status says how the
    // answer ended.
    ChatMessage message = 3;
    // The answer failed. Sent once, before the message with the failed status.
    ChatError error = 4;
  }
}

message ChatError {
  ChatErrorCode code = 1;
  // A readable reason to show to the user, without technical details.
  string message = 2;
}

message Citations {
  repeated Citation items = 1;
}

// The prompts that build the system message of an answer. Templates are text
// with variables in braces: {sources} (the numbered passages) and {history}
// (the earlier messages). Write {{ and }} for literal braces. A template that
// uses {history} shows the history itself, and it is then not sent again as
// separate messages.
message PromptTemplates {
  // Instructions to the model, used by conversations without their own system
  // prompt. When it does not use {sources}, the sources are added with
  // sources_template.
  PromptTemplate system_prompt = 1;
  // Added after the system prompt when sources were found; must contain
  // {sources}.
  PromptTemplate sources_template = 2;
  // Added after the system prompt when the knowledge base is used but no source
  // was found.
  PromptTemplate no_sources_template = 3;
  // The variables templates can use.
  repeated string variables = 4;
}

message PromptTemplate {
  // The text in use.
  string content = 1;
  // The built-in text, which "reset" returns to.
  string default_content = 2;
  // Whether content is the built-in text, i.e. no admin has changed it.
  bool is_default = 3;
}

message GetPromptTemplatesRequest {}

message GetPromptTemplatesResponse {
  PromptTemplates templates = 1;
}

message UpdatePromptTemplatesRequest {
  // Each template is replaced when set; an empty text resets it to the built-in
  // one. Invalid templates are rejected with INVALID_ARGUMENT (violation field
  // names the template).
  optional string system_prompt = 1;
  optional string sources_template = 2;
  optional string no_sources_template = 3;
}

message UpdatePromptTemplatesResponse {
  PromptTemplates templates = 1;
}
