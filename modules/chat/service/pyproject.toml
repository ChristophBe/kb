[project]
name = "knowcel-chat-service"
version = "0.1.0"
description = "kb chat module: conversations with retrieval-augmented answers"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "knowcel-chat-api",
    "knowcel-document-api",
    "knowcel-llm-api",
    "knowcel-platform",
    "sqlalchemy[asyncio]>=2.0.40",
]

[project.scripts]
knowcel-chat-service = "knowcel_chat.__main__:main"

[tool.uv.sources]
knowcel-chat-api = { workspace = true }
knowcel-document-api = { workspace = true }
knowcel-llm-api = { workspace = true }
knowcel-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowcel_chat"]
