[project]
name = "kb-chat-service"
version = "0.1.0"
description = "kb chat module: conversations with retrieval-augmented answers"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "kb-chat-api",
    "kb-document-api",
    "kb-llm-api",
    "kb-platform",
    "sqlalchemy[asyncio]>=2.0.40",
]

[project.scripts]
kb-chat-service = "kb_chat.__main__:main"

[tool.uv.sources]
kb-chat-api = { workspace = true }
kb-document-api = { workspace = true }
kb-llm-api = { workspace = true }
kb-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_chat"]
