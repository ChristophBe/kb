# Module manifest — consumed by tools/modgen (`task gen`).
id: curation
title: Curation
description: Relevance and freshness scores and findings (duplicate, superseded, conflicting documents) that keep the knowledge base consistent.
services:
  - name: curation-service
    language: python
    port: 9005
    metrics_port: 9107
    infra: [postgres]
    grpc_services: [knowcel.curation.v1.CurationService]
# Documents are read and searched through document, contradictions are judged by llm,
# the processed events come from ingestion, and iam tells which documents a caller may see; while iam is down, only the caller's own do.
depends_on: [document, ingestion, llm, iam]
consumes:
  - knowcel.ingestion.processed
