[project]
name = "knowcel-curation-service"
version = "0.1.0"
description = "kb curation module: relevance, freshness and consistency of documents"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "knowcel-curation-api",
    "knowcel-document-api",
    "knowcel-iam-api",
    "knowcel-llm-api",
    "knowcel-platform",
    "sqlalchemy[asyncio]>=2.0.40",
]

[project.scripts]
knowcel-curation-service = "knowcel_curation.__main__:main"

[tool.uv.sources]
knowcel-curation-api = { workspace = true }
knowcel-document-api = { workspace = true }
knowcel-iam-api = { workspace = true }
knowcel-llm-api = { workspace = true }
knowcel-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowcel_curation"]
