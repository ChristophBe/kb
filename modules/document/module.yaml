# Module manifest — consumed by tools/modgen (`task gen`).
id: document
title: Documents
description: Document metadata, raw file storage and the chunk/vector index.
services:
  - name: document-service
    language: go
    port: 9001
    metrics_port: 9101
    infra: [postgres, s3, nats]
    # Deployment defaults (Helm components.document-service.env): upload
    # limits, and the cleanup of abandoned uploads and orphaned files.
    env:
      KNOWCEL_MAX_UPLOAD_BYTES: "52428800"
      KNOWCEL_ALLOWED_CONTENT_TYPES: application/pdf,text/*,application/json,application/yaml,application/x-yaml
      KNOWCEL_CLEANUP_INTERVAL: 1h
      KNOWCEL_UPLOAD_TTL: 24h
      KNOWCEL_ORPHAN_GRACE: 1h
    grpc_services: [knowcel.document.v1.DocumentService]
    # Called only by other modules' services (ingestion creates, replaces and
    # fills documents, chat retrieves chunks); Envoy does not route them.
    internal:
      - knowcel.document.v1.DocumentService/CreateDocument
      - knowcel.document.v1.DocumentService/ReplaceContent
      - knowcel.document.v1.DocumentService/SetDocumentStatus
      - knowcel.document.v1.DocumentService/ReadContent
      - knowcel.document.v1.DocumentService/AddChunks
      - knowcel.document.v1.DocumentService/SearchChunks
ui: "@knowcel/module-document"
# SearchDocuments embeds queries through llm; everything else works without it.
depends_on: [llm]
