syntax = "proto3";

package kb.document.v1;

import "google/protobuf/timestamp.proto";
import "kb/common/v1/common.proto";

option go_package = "github.com/christoph/kb/modules/document/api/go/documentv1;documentv1";

// DocumentService owns document metadata, raw file storage and the chunk /
// vector index. Other modules access documents only through this service.
service DocumentService {
  // CreateDocument registers a document and returns a presigned URL the
  // client uploads the raw file to.
  rpc CreateDocument(CreateDocumentRequest) returns (CreateDocumentResponse);
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc ListDocuments(ListDocumentsRequest) returns (ListDocumentsResponse);
  rpc UpdateDocument(UpdateDocumentRequest) returns (UpdateDocumentResponse);
  rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
  rpc SetDocumentStatus(SetDocumentStatusRequest) returns (SetDocumentStatusResponse);
  // GetDownloadUrl returns a short-lived URL for downloading the raw file.
  rpc GetDownloadUrl(GetDownloadUrlRequest) returns (GetDownloadUrlResponse);
  // ReadContent streams the raw file for backend consumers.
  rpc ReadContent(ReadContentRequest) returns (stream ReadContentResponse);
  // AddChunks replaces all chunks of a document and marks it ready.
  rpc AddChunks(AddChunksRequest) returns (AddChunksResponse);
  // ListChunks returns a document's chunks in index order.
  rpc ListChunks(ListChunksRequest) returns (ListChunksResponse);
  rpc SearchChunks(SearchChunksRequest) returns (SearchChunksResponse);
  // SearchDocuments embeds a text query through the llm module and returns
  // the most similar documents, each with its best chunk, and the most
  // similar chunks. It fails with UNAVAILABLE while llm is down.
  rpc SearchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse);
}

enum DocumentStatus {
  DOCUMENT_STATUS_UNSPECIFIED = 0;
  DOCUMENT_STATUS_PENDING_UPLOAD = 1;
  DOCUMENT_STATUS_UPLOADED = 2;
  DOCUMENT_STATUS_PROCESSING = 3;
  DOCUMENT_STATUS_READY = 4;
  DOCUMENT_STATUS_FAILED = 5;
}

message Document {
  string id = 1;
  string title = 2;
  string filename = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  DocumentStatus status = 6;
  string status_detail = 7;
  int32 chunk_count = 8;
  map<string, string> metadata = 9;
  google.protobuf.Timestamp create_time = 10;
  google.protobuf.Timestamp update_time = 11;
  // The user who uploaded the document, as the subject of their token. Set by
  // the service; only this user can see the document.
  string owner_id = 12;
  // The SHA-256 of the file as declared at creation, in lowercase hex; empty
  // when none was declared.
  string sha256 = 13;
}

message Chunk {
  string document_id = 1;
  int32 index = 2;
  string text = 3;
  map<string, string> metadata = 4;
}

message ScoredChunk {
  Chunk chunk = 1;
  string document_title = 2;
  // Cosine similarity in [-1, 1]; higher is more similar.
  float score = 3;
}

// A document ranked by its most similar chunk.
message ScoredDocument {
  string document_id = 1;
  string title = 2;
  // The best chunk's cosine similarity in [-1, 1]; higher is more similar.
  float score = 3;
  Chunk best_chunk = 4;
}

// CreateDocument rejects, with field violations, a file that is empty, larger
// than the service's upload limit or of a type it does not accept.
message CreateDocumentRequest {
  string title = 1;
  string filename = 2;
  // A missing or generic type (application/octet-stream) is replaced by the
  // type the filename's extension stands for, if the service knows one.
  string content_type = 3;
  // The file's exact size; must be greater than 0.
  int64 size_bytes = 4;
  map<string, string> metadata = 5;
  // Optional SHA-256 of the file, in hex. When set, SetDocumentStatus(UPLOADED)
  // checks the uploaded file against it and fails the document on a mismatch.
  string sha256 = 6;
}

message CreateDocumentResponse {
  Document document = 1;
  // A presigned URL to PUT the file to. The request must send the
  // document's content_type as Content-Type and exactly size_bytes bytes;
  // the storage server refuses any other upload.
  string upload_url = 2;
}

message GetDocumentRequest {
  string id = 1;
}

message GetDocumentResponse {
  Document document = 1;
}

message ListDocumentsRequest {
  kb.common.v1.PageRequest page = 1;
}

message ListDocumentsResponse {
  repeated Document documents = 1;
  kb.common.v1.PageResponse page = 2;
}

message UpdateDocumentRequest {
  string id = 1;
  optional string title = 2;
  // Replaces the metadata map when set_metadata is true.
  map<string, string> metadata = 3;
  bool set_metadata = 4;
}

message UpdateDocumentResponse {
  Document document = 1;
}

message DeleteDocumentRequest {
  string id = 1;
}

message DeleteDocumentResponse {}

// Setting UPLOADED checks the uploaded file: FAILED_PRECONDITION when it is
// missing. A file larger than the upload limit or not matching the declared
// sha256 sets the document FAILED, with the reason in status_detail, and
// fails with FAILED_PRECONDITION and ErrorInfo reason UPLOAD_REJECTED.
message SetDocumentStatusRequest {
  string id = 1;
  DocumentStatus status = 2;
  string status_detail = 3;
}

message SetDocumentStatusResponse {
  Document document = 1;
}

message GetDownloadUrlRequest {
  string id = 1;
}

message GetDownloadUrlResponse {
  string url = 1;
}

message ReadContentRequest {
  string id = 1;
}

message ReadContentResponse {
  bytes data = 1;
}

message ChunkInput {
  int32 index = 1;
  string text = 2;
  repeated float embedding = 3;
  map<string, string> metadata = 4;
}

message AddChunksRequest {
  string document_id = 1;
  repeated ChunkInput chunks = 2;
}

message AddChunksResponse {
  int32 chunk_count = 1;
}

message ListChunksRequest {
  string document_id = 1;
  kb.common.v1.PageRequest page = 2;
}

message ListChunksResponse {
  repeated Chunk chunks = 1;
  kb.common.v1.PageResponse page = 2;
}

message SearchChunksRequest {
  repeated float embedding = 1;
  int32 limit = 2;
  // Restricts the search to these documents when non-empty.
  repeated string document_ids = 3;
}

message SearchChunksResponse {
  repeated ScoredChunk results = 1;
}

message SearchDocumentsRequest {
  // The text to search for; must not be blank.
  string query = 1;
  // How many documents to return; also caps `results`.
  int32 limit = 2;
  // Restricts the search to these documents when non-empty.
  repeated string document_ids = 3;
}

message SearchDocumentsResponse {
  // The most similar chunks, most similar first; a document can appear more
  // than once.
  repeated ScoredChunk results = 1;
  // The most similar documents, each once, ordered by their best chunk.
  repeated ScoredDocument documents = 2;
}
