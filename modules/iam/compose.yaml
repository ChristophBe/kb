services:
  iam-service:
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args: { CMD: ./modules/iam/service/cmd/iam-service, KNOWCEL_VERSION: "${KNOWCEL_VERSION:-dev}" }
    environment:
      KNOWCEL_LOG_LEVEL: ${KNOWCEL_LOG_LEVEL:-info}
      KNOWCEL_OTEL_ENDPOINT: ${KNOWCEL_OTEL_ENDPOINT:-}
      KNOWCEL_DATABASE_URL: postgres://kb:kb@postgres:5432/kb?sslmode=disable
      # Subjects or emails of the first platform admins, comma-separated.
      # alice is the dev Dex user (deploy/dex).
      KNOWCEL_IAM_BOOTSTRAP_ADMINS: ${KNOWCEL_IAM_BOOTSTRAP_ADMINS:-alice@example.com}
    # gRPC and Prometheus /metrics (docs/metrics.md).
    ports: ["9006:9006", "9106:9106"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 2s
      retries: 30
    develop:
      watch:
        - { action: rebuild, path: . }
        - { action: rebuild, path: ../../platform/go }
