syntax = "proto3";

package knowcel.iam.v1;

option go_package = "github.com/ChristophBe/knowcelium/modules/iam/api/go/iamv1;iamv1";

// IamService owns the registry of users, and the teams and roles built on it.
// Other modules access them only through this service.
service IamService {
  // GetCurrentUser returns the calling user. The first call of a subject
  // registers the user; later calls update the email and display name from
  // the token.
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);

  // CreateTeam creates a team with the caller as its first admin.
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  // GetTeam returns a team with its members. A caller who is not a member
  // gets NOT_FOUND.
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  // ListMyTeams returns the teams the caller is a member of, without members.
  rpc ListMyTeams(ListMyTeamsRequest) returns (ListMyTeamsResponse);
  // UpdateTeam renames a team. Team admins only.
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse);
  // DeleteTeam deletes a team and its memberships. Team admins only.
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse);
  // AddMember adds a registered user, found by email, to a team. Team admins
  // only. An unknown email returns NOT_FOUND, a user who is already a member
  // ALREADY_EXISTS.
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  // RemoveMember removes a member. Team admins may remove anyone; a member may
  // remove only themselves (leave). The last admin cannot be removed
  // (FAILED_PRECONDITION).
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // SetMemberRole changes a member's role. Team admins only. The last admin
  // cannot be demoted (FAILED_PRECONDITION).
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse);

  // ResolveCaller returns the caller's platform-admin flag and team
  // memberships, for the access checks of other modules. Internal: only
  // services call it, passing the user on. A caller who is not registered
  // yet resolves to no teams and no admin rights.
  rpc ResolveCaller(ResolveCallerRequest) returns (ResolveCallerResponse);
}

// User is a registered user. The id is the subject of the user's OIDC token,
// the same id other modules store as the owner of their data.
message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
  // platform_admin is set for the users configured as platform admins on
  // their first call, and for those promoted later.
  bool platform_admin = 4;
}

message GetCurrentUserRequest {}

message GetCurrentUserResponse {
  User user = 1;
}

enum TeamRole {
  TEAM_ROLE_UNSPECIFIED = 0;
  TEAM_ROLE_ADMIN = 1;
  TEAM_ROLE_MEMBER = 2;
}

message Team {
  string id = 1;
  string name = 2;
  // my_role is the caller's role in the team.
  TeamRole my_role = 3;
  // members is filled by GetTeam and the member mutations, not by ListMyTeams.
  repeated TeamMember members = 4;
}

message TeamMember {
  string user_id = 1;
  string email = 2;
  string display_name = 3;
  TeamRole role = 4;
}

message CreateTeamRequest {
  string name = 1;
}

message CreateTeamResponse {
  Team team = 1;
}

message GetTeamRequest {
  string id = 1;
}

message GetTeamResponse {
  Team team = 1;
}

message ListMyTeamsRequest {}

message ListMyTeamsResponse {
  repeated Team teams = 1;
}

message UpdateTeamRequest {
  string id = 1;
  string name = 2;
}

message UpdateTeamResponse {
  Team team = 1;
}

message DeleteTeamRequest {
  string id = 1;
}

message DeleteTeamResponse {}

message AddMemberRequest {
  string team_id = 1;
  string email = 2;
  // role defaults to TEAM_ROLE_MEMBER when unspecified.
  TeamRole role = 3;
}

message AddMemberResponse {
  TeamMember member = 1;
}

message RemoveMemberRequest {
  string team_id = 1;
  string user_id = 2;
}

message RemoveMemberResponse {}

message SetMemberRoleRequest {
  string team_id = 1;
  string user_id = 2;
  TeamRole role = 3;
}

message SetMemberRoleResponse {
  TeamMember member = 1;
}

message ResolveCallerRequest {}

message ResolveCallerResponse {
  string user_id = 1;
  bool platform_admin = 2;
  repeated CallerTeam teams = 3;
}

// CallerTeam is a team the caller is a member of, with their role in it.
message CallerTeam {
  string team_id = 1;
  TeamRole role = 2;
}
