services:
  ingestion-service:
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args: { CMD: ./modules/ingestion/service/cmd/ingestion-service, KNOWCEL_VERSION: "${KNOWCEL_VERSION:-dev}" }
    environment:
      KNOWCEL_LOG_LEVEL: ${KNOWCEL_LOG_LEVEL:-info}
      KNOWCEL_OTEL_ENDPOINT: ${KNOWCEL_OTEL_ENDPOINT:-}
      KNOWCEL_DATABASE_URL: postgres://kb:kb@postgres:5432/kb?sslmode=disable
      KNOWCEL_NATS_URL: nats://nats:4222
      KNOWCEL_DOCUMENT_ADDR: document-service:9001
      # Pages fetched from a URL are uploaded to the S3 server inside the stack; the signed URLs name its public address.
      KNOWCEL_UPLOAD_ENDPOINT: s3:8333
    # gRPC and Prometheus /metrics (docs/metrics.md).
    ports: ["9002:9002", "9102:9102"]
    # Infrastructure only: other modules are soft dependencies (docs/architecture/module.md).
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 2s
      retries: 30
    develop:
      watch:
        - { action: rebuild, path: ./service }
        - { action: rebuild, path: ../../platform/go }

  ingestion-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args: { PACKAGE: knowcel-ingestion-worker, KNOWCEL_VERSION: "${KNOWCEL_VERSION:-dev}" }
    environment:
      KNOWCEL_LOG_LEVEL: ${KNOWCEL_LOG_LEVEL:-INFO}
      KNOWCEL_OTEL_ENDPOINT: ${KNOWCEL_OTEL_ENDPOINT:-}
      KNOWCEL_NATS_URL: nats://nats:4222
      KNOWCEL_DOCUMENT_ADDR: document-service:9001
      KNOWCEL_LLM_ADDR: llm-service:9004
      # Chunk sizes in tokens of the embedding model (see .env.example).
      KNOWCEL_CHUNK_TOKENIZER: ${KNOWCEL_CHUNK_TOKENIZER:-nomic-embed-text}
      KNOWCEL_CHUNK_TOKENS: ${KNOWCEL_CHUNK_TOKENS:-256}
      KNOWCEL_CHUNK_OVERLAP_TOKENS: ${KNOWCEL_CHUNK_OVERLAP_TOKENS:-32}
      KNOWCEL_EMBEDDING_MAX_TOKENS: ${KNOWCEL_EMBEDDING_MAX_TOKENS:-2048}
      KNOWCEL_OCR_ENABLED: ${KNOWCEL_OCR_ENABLED:-false}
      KNOWCEL_OCR_LANGUAGES: ${KNOWCEL_OCR_LANGUAGES:-eng}
      KNOWCEL_WORKER_CONCURRENCY: ${KNOWCEL_WORKER_CONCURRENCY:-2}
    # Prometheus /metrics (docs/metrics.md).
    ports: ["9105:9105"]
    # The worker pauses job intake while document or llm is down.
    depends_on:
      nats: { condition: service_healthy }
    develop:
      watch:
        - { action: sync+restart, path: ./worker/src, target: /app/modules/ingestion/worker/src }
        - { action: sync+restart, path: ../../platform/python/src, target: /app/platform/python/src }
