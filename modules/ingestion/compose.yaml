services:
  ingestion-service:
    build:
      context: ../..
      dockerfile: deploy/docker/go.Dockerfile
      args: { CMD: ./modules/ingestion/service/cmd/ingestion-service }
    environment:
      KB_LOG_LEVEL: ${KB_LOG_LEVEL:-info}
      KB_DATABASE_URL: postgres://kb:kb@postgres:5432/kb?sslmode=disable
      KB_NATS_URL: nats://nats:4222
      KB_DOCUMENT_ADDR: document-service:9001
    ports: ["9002:9002"]
    # Infrastructure only: other modules are soft dependencies (docs/architecture/module.md).
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 2s
      retries: 30
    develop:
      watch:
        - { action: rebuild, path: ./service }
        - { action: rebuild, path: ../../platform/go }

  ingestion-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args: { PACKAGE: kb-ingestion-worker }
    environment:
      KB_LOG_LEVEL: ${KB_LOG_LEVEL:-INFO}
      KB_NATS_URL: nats://nats:4222
      KB_DOCUMENT_ADDR: document-service:9001
      KB_LLM_ADDR: llm-service:9004
      # Chunk sizes in tokens of the embedding model (see .env.example).
      KB_CHUNK_TOKENIZER: ${KB_CHUNK_TOKENIZER:-nomic-embed-text}
      KB_CHUNK_TOKENS: ${KB_CHUNK_TOKENS:-256}
      KB_CHUNK_OVERLAP_TOKENS: ${KB_CHUNK_OVERLAP_TOKENS:-32}
      KB_EMBEDDING_MAX_TOKENS: ${KB_EMBEDDING_MAX_TOKENS:-2048}
      KB_WORKER_CONCURRENCY: ${KB_WORKER_CONCURRENCY:-2}
    # The worker pauses job intake while document or llm is down.
    depends_on:
      nats: { condition: service_healthy }
    develop:
      watch:
        - { action: sync+restart, path: ./worker/src, target: /app/modules/ingestion/worker/src }
        - { action: sync+restart, path: ../../platform/python/src, target: /app/platform/python/src }
