# Module manifest — consumed by tools/modgen (`task gen`).
id: ingestion
title: Ingestion
description: Uploads and the extract → chunk → embed processing pipeline.
services:
  - name: ingestion-service
    language: go
    port: 9002
    metrics_port: 9102
    infra: [postgres, nats]
    grpc_services: [knowcel.ingestion.v1.IngestionService]
  - name: ingestion-worker
    language: python
    metrics_port: 9105
    infra: [nats]
ui: "@knowcel/module-ingestion"
# Documents are created and filled through the document module; the worker embeds via llm.
# The upload page lists the user's teams (iam) to share new documents with; without
# iam it offers none.
depends_on: [document, llm, iam]
consumes:
  - knowcel.ingestion.uploaded   # ingestion-worker
  - knowcel.ingestion.started    # ingestion-service (job status)
  - knowcel.ingestion.progress
  - knowcel.ingestion.processed
  - knowcel.ingestion.failed
  - knowcel.document.reindex_requested   # ingestion-service (reprocess after an embedding model change)
