# Module manifest — consumed by tools/modgen (`task gen`).
id: ingestion
title: Ingestion
description: Uploads and the extract → chunk → embed processing pipeline.
services:
  - name: ingestion-service
    language: go
    port: 9002
    grpc_services: [kb.ingestion.v1.IngestionService]
  - name: ingestion-worker
    language: python
ui: "@kb/module-ingestion"
# Documents are created and filled through the document module; the worker embeds via llm.
depends_on: [document, llm]
consumes:
  - kb.ingestion.uploaded   # ingestion-worker
  - kb.ingestion.started    # ingestion-service (job status)
  - kb.ingestion.progress
  - kb.ingestion.processed
  - kb.ingestion.failed
