[project]
name = "knowcel-ingestion-worker"
version = "0.1.0"
description = "kb ingestion module: extract, chunk and embed uploaded documents"
requires-python = ">=3.13"
dependencies = [
    "knowcel-document-api",
    "knowcel-ingestion-api",
    "knowcel-llm-api",
    "knowcel-platform",
    "lxml-html-clean>=0.4.6",
    "prometheus-client>=0.26",
    "pypdf>=6.0",
    "pypdfium2>=5.15.2",
    "pytesseract>=0.3.13",
    "python-docx>=1.2.0",
    "readability-lxml>=0.9",
    "tokenizers>=0.22",
]

[project.scripts]
knowcel-ingestion-worker = "knowcel_ingestion_worker.__main__:main"

[tool.uv.sources]
knowcel-document-api = { workspace = true }
knowcel-ingestion-api = { workspace = true }
knowcel-llm-api = { workspace = true }
knowcel-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowcel_ingestion_worker"]
