services:
  llm-service:
    build:
      context: ../..
      dockerfile: deploy/docker/python.Dockerfile
      args: { PACKAGE: knowcel-llm-service, KNOWCEL_VERSION: "${KNOWCEL_VERSION:-dev}" }
    environment:
      KNOWCEL_LOG_LEVEL: ${KNOWCEL_LOG_LEVEL:-INFO}
      KNOWCEL_OTEL_ENDPOINT: ${KNOWCEL_OTEL_ENDPOINT:-}
      # Soft dependency: no depends_on on iam-service; while it is down, models can't be pulled or deleted.
      KNOWCEL_IAM_ADDR: iam-service:9006
      KNOWCEL_LLM_PROVIDER: ${KNOWCEL_LLM_PROVIDER:-ollama}
      KNOWCEL_CHAT_PROVIDER: ${KNOWCEL_CHAT_PROVIDER:-}
      KNOWCEL_EMBEDDING_PROVIDER: ${KNOWCEL_EMBEDDING_PROVIDER:-}
      KNOWCEL_OLLAMA_URL: ${KNOWCEL_OLLAMA_URL:-http://ollama:11434}
      KNOWCEL_CHAT_MODEL: ${KNOWCEL_CHAT_MODEL:-llama3.2}
      KNOWCEL_EMBEDDING_MODEL: ${KNOWCEL_EMBEDDING_MODEL:-nomic-embed-text}
      KNOWCEL_ANTHROPIC_API_KEY: ${KNOWCEL_ANTHROPIC_API_KEY:-}
      KNOWCEL_ANTHROPIC_CHAT_MODEL: ${KNOWCEL_ANTHROPIC_CHAT_MODEL:-claude-sonnet-5-5}
      KNOWCEL_EMBEDDING_DIMENSIONS: ${KNOWCEL_EMBEDDING_DIMENSIONS:-768}
      KNOWCEL_FAKE_TOKEN_DELAY: ${KNOWCEL_FAKE_TOKEN_DELAY:-0}
      KNOWCEL_FAKE_EMBEDDING_MODEL: ${KNOWCEL_FAKE_EMBEDDING_MODEL:-fake-embed}
    # gRPC and Prometheus /metrics (docs/metrics.md).
    ports: ["9004:9004", "9104:9104"]
    depends_on:
      ollama: { condition: service_started, required: false }
      ollama-pull: { condition: service_completed_successfully, required: false }
    healthcheck:
      test: ["CMD", "python", "-m", "knowcel_platform.healthcheck", "9004"]
      interval: 2s
      retries: 30
    develop:
      watch:
        - { action: sync+restart, path: ./service/src, target: /app/modules/llm/service/src }
        - { action: sync+restart, path: ../../platform/python/src, target: /app/platform/python/src }

  # Local model server; enable with `--profile ollama`, or point
  # KNOWCEL_OLLAMA_URL at an Ollama running on the host (faster on macOS).
  ollama:
    image: ollama/ollama:0.40.13
    profiles: [ollama]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

  ollama-pull:
    image: ollama/ollama:0.40.13
    profiles: [ollama]
    environment: { OLLAMA_HOST: "ollama:11434" }
    entrypoint: ["sh", "-c", "ollama pull ${KNOWCEL_CHAT_MODEL:-llama3.2} && ollama pull ${KNOWCEL_EMBEDDING_MODEL:-nomic-embed-text}"]
    depends_on: [ollama]
    restart: "no"

volumes:
  ollama:
