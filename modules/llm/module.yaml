# Module manifest — consumed by tools/modgen (`task gen`).
id: llm
title: Models
description: Gateway to LLM providers (generation and embeddings).
services:
  - name: llm-service
    language: python
    port: 9004
    metrics_port: 9104
    # Deployment defaults (Helm components.llm-service.env); the code's own
    # defaults point at localhost. The chart's Ollama (ollama.enabled) or any
    # other reachable Ollama.
    env:
      KNOWCEL_LLM_PROVIDER: ollama
      KNOWCEL_OLLAMA_URL: http://ollama:11434
    grpc_services: [knowcel.llm.v1.LlmService]
    # Generation and embeddings are for other modules' services only (chat,
    # document search, ingestion worker); Envoy does not route them.
    internal:
      - knowcel.llm.v1.LlmService/Generate
      - knowcel.llm.v1.LlmService/Embed
ui: "@knowcel/module-llm"
# iam tells whether the caller is a platform admin, who alone may pull and
# delete models; while it is down, nobody can, and everything else works.
depends_on: [iam]
