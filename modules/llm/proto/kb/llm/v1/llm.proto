syntax = "proto3";

package kb.llm.v1;

option go_package = "github.com/christoph/kb/modules/llm/api/go/llmv1;llmv1";

// LlmService is the single gateway to language-model providers. No other
// module talks to an LLM vendor directly.
service LlmService {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc GetProviderStatus(GetProviderStatusRequest) returns (GetProviderStatusResponse);
  // Generate streams the completion as text deltas, followed by a final
  // message carrying usage information.
  rpc Generate(GenerateRequest) returns (stream GenerateResponse);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
}

enum ModelKind {
  MODEL_KIND_UNSPECIFIED = 0;
  MODEL_KIND_CHAT = 1;
  MODEL_KIND_EMBEDDING = 2;
}

message Model {
  string id = 1;
  string provider = 2;
  ModelKind kind = 3;
}

message Message {
  Role role = 1;
  string content = 2;
}

message GenerationOptions {
  optional float temperature = 1;
  optional int32 max_tokens = 2;
}

message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
}

message ListModelsRequest {}

message ListModelsResponse {
  // The chat provider's chat models and the embedding provider's embedding
  // models.
  repeated Model models = 1;
}

message GetProviderStatusRequest {}

// ProviderHealth is the state of the provider serving one task.
message ProviderHealth {
  // Registry name, e.g. "ollama" or "anthropic".
  string provider = 1;
  bool healthy = 2;
  string detail = 3;
}

message GetProviderStatusResponse {
  // The provider's name when one serves chat and embeddings, else
  // "<chat>+<embedding>" (e.g. "anthropic+ollama"). See chat and embedding.
  string provider = 1;
  // True when both the chat and the embedding provider are healthy.
  bool healthy = 2;
  // The detail of each provider, prefixed by its task when they differ.
  string detail = 3;
  string default_chat_model = 4;
  string default_embedding_model = 5;
  int32 embedding_dimensions = 6;
  // Provider serving Generate (KB_CHAT_PROVIDER).
  ProviderHealth chat = 7;
  // Provider serving Embed (KB_EMBEDDING_PROVIDER).
  ProviderHealth embedding = 8;
}

message GenerateRequest {
  // Model id; empty selects the chat provider's default chat model.
  string model = 1;
  repeated Message messages = 2;
  GenerationOptions options = 3;
}

message GenerateResponse {
  string delta = 1;
  // Set on the final message of the stream only.
  bool done = 2;
  Usage usage = 3;
  string model = 4;
}

message EmbedRequest {
  // Model id; empty selects the embedding provider's default embedding model.
  string model = 1;
  repeated string inputs = 2;
}

message Embedding {
  repeated float values = 1;
}

message EmbedResponse {
  repeated Embedding embeddings = 1;
  string model = 2;
  int32 dimensions = 3;
}
