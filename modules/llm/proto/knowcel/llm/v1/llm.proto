syntax = "proto3";

package knowcel.llm.v1;

option go_package = "github.com/ChristophBe/knowcelium/modules/llm/api/go/llmv1;llmv1";

// LlmService is the single gateway to language-model providers. No other
// module talks to an LLM vendor directly.
service LlmService {
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc GetProviderStatus(GetProviderStatusRequest) returns (GetProviderStatusResponse);
  // Generate streams the completion as text deltas, followed by a final
  // message carrying usage information.
  rpc Generate(GenerateRequest) returns (stream GenerateResponse);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  // Rerank scores how well each document answers a query, so a caller can
  // reorder candidates found by vector similarity. Served by the chat
  // provider; a provider that can't rerank returns UNIMPLEMENTED.
  rpc Rerank(RerankRequest) returns (RerankResponse);
  // PullModel downloads a model to a provider and streams the progress, ending
  // with a message with done set. Platform admins only; providers that can't
  // manage models return UNIMPLEMENTED.
  rpc PullModel(PullModelRequest) returns (stream PullModelResponse);
  // DeleteModel removes a model from a provider. Platform admins only;
  // providers that can't manage models return UNIMPLEMENTED.
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);
  // GetUsage sums the tokens of recorded generations per day, model and
  // calling module. Platform admins see every user's usage, everyone else
  // their own; calls without a user are rejected with UNAUTHENTICATED.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SYSTEM = 1;
  ROLE_USER = 2;
  ROLE_ASSISTANT = 3;
}

enum ModelKind {
  MODEL_KIND_UNSPECIFIED = 0;
  MODEL_KIND_CHAT = 1;
  MODEL_KIND_EMBEDDING = 2;
}

message Model {
  string id = 1;
  string provider = 2;
  ModelKind kind = 3;
}

message Message {
  Role role = 1;
  string content = 2;
}

message GenerationOptions {
  optional float temperature = 1;
  optional int32 max_tokens = 2;
}

message Usage {
  int32 input_tokens = 1;
  int32 output_tokens = 2;
}

message ListModelsRequest {}

message ListModelsResponse {
  // The chat provider's chat models and the embedding provider's embedding
  // models.
  repeated Model models = 1;
}

message GetProviderStatusRequest {}

// ProviderHealth is the state of the provider serving one task.
message ProviderHealth {
  // Registry name, e.g. "ollama" or "anthropic".
  string provider = 1;
  bool healthy = 2;
  string detail = 3;
}

message GetProviderStatusResponse {
  // The provider's name when one serves chat and embeddings, else
  // "<chat>+<embedding>" (e.g. "anthropic+ollama"). See chat and embedding.
  string provider = 1;
  // True when both the chat and the embedding provider are healthy.
  bool healthy = 2;
  // The detail of each provider, prefixed by its task when they differ.
  string detail = 3;
  string default_chat_model = 4;
  string default_embedding_model = 5;
  int32 embedding_dimensions = 6;
  // Provider serving Generate (KNOWCEL_CHAT_PROVIDER).
  ProviderHealth chat = 7;
  // Provider serving Embed (KNOWCEL_EMBEDDING_PROVIDER).
  ProviderHealth embedding = 8;
}

message GenerateRequest {
  // Model id; empty selects the chat provider's default chat model.
  string model = 1;
  repeated Message messages = 2;
  GenerationOptions options = 3;
  // Id of the calling module (e.g. "chat"), under which the generation is
  // recorded in the usage; empty is recorded as "unknown".
  string caller_module = 4;
}

message GenerateResponse {
  string delta = 1;
  // Set on the final message of the stream only.
  bool done = 2;
  Usage usage = 3;
  string model = 4;
}

message EmbedRequest {
  // Model id; empty selects the embedding provider's default embedding model.
  string model = 1;
  repeated string inputs = 2;
}

message Embedding {
  repeated float values = 1;
}

message EmbedResponse {
  repeated Embedding embeddings = 1;
  string model = 2;
  int32 dimensions = 3;
}

message RerankRequest {
  // Model id; empty selects the chat provider's default chat model.
  string model = 1;
  string query = 2;
  // The candidates, at most 50. The caller only sends documents it may show.
  repeated string documents = 3;
}

message RerankResponse {
  // One relevance score from 0 (unrelated) to 1 (answers the query) per
  // document, in the order of the request.
  repeated float scores = 1;
  string model = 2;
}

message PullModelRequest {
  // Registry name of the provider (a Model.provider or a ProviderHealth.provider).
  // Empty selects the chat provider.
  string provider = 1;
  string model = 2;
}

message PullModelResponse {
  // What the provider is doing, e.g. "pulling manifest" or "verifying sha256 digest".
  string status = 1;
  // Bytes of the current download step; total is 0 when the step has no size.
  int64 completed = 2;
  int64 total = 3;
  // Set on the final message of the stream only.
  bool done = 4;
}

message DeleteModelRequest {
  // Registry name of the provider (a Model.provider). Empty selects the chat provider.
  string provider = 1;
  string model = 2;
}

message DeleteModelResponse {}

message GetUsageRequest {
  // How many days back to sum, today included; 0 selects 30. At most 366.
  int32 days = 1;
}

// UsageEntry sums the generations of one day, model and calling module.
message UsageEntry {
  // The day in UTC, as YYYY-MM-DD.
  string date = 1;
  string provider = 2;
  string model = 3;
  string caller_module = 4;
  int64 requests = 5;
  int64 input_tokens = 6;
  int64 output_tokens = 7;
}

message GetUsageResponse {
  // Newest day first, then by model and calling module.
  repeated UsageEntry entries = 1;
}
