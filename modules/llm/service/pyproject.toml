[project]
name = "kb-llm-service"
version = "0.1.0"
description = "kb llm module: gateway to LLM providers"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3",
    "httpx>=0.28",
    "kb-llm-api",
    "kb-platform",
]

[project.scripts]
kb-llm-service = "kb_llm.__main__:main"

[tool.uv.sources]
kb-llm-api = { workspace = true }
kb-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_llm"]
