[project]
name = "knowcel-llm-service"
version = "0.1.0"
description = "kb llm module: gateway to LLM providers"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3",
    "httpx>=0.28",
    "knowcel-llm-api",
    "knowcel-platform",
    "prometheus-client>=0.26",
]

[project.scripts]
knowcel-llm-service = "knowcel_llm.__main__:main"

[tool.uv.sources]
knowcel-llm-api = { workspace = true }
knowcel-platform = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowcel_llm"]
