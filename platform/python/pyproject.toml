[project]
name = "kb-platform"
version = "0.1.0"
description = "Shared runtime building blocks for kb Python components"
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.85.0",
    "grpcio-health-checking>=1.85.0",
    "grpcio-reflection>=1.85.0",
    "grpcio-status>=1.85.0",
    "nats-py>=2.11",
    # Tracing (kb_platform.telemetry); keep the four on one release.
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-grpc==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "prometheus-client>=0.26",
    "pydantic-settings>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_platform"]
