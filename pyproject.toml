# uv workspace spanning every Python component and generated API package.
[project]
name = "kb"
version = "0.1.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "grpcio-tools==1.85.0", # pins generated Python code (tools/protoc-gen-kbpy)
    "pyright>=1.1.400",
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "platform/python",
    "platform/api/python",
    "modules/*/api/python",
    "modules/chat/service",
    "modules/ingestion/worker",
    "modules/llm/service",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/api/python/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["platform/python", "modules/*/service", "modules/*/worker"]
exclude = ["**/api/python/src", "**/.venv", "**/node_modules"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Run per component (see Taskfile `test:py`) with --rootdir set to the component,
# so test modules are named tests.* and never shadow stdlib modules like `platform`.
addopts = ["--import-mode=importlib"]
