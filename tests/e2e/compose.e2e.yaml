# Override for the end-to-end smoke test (tests/e2e), applied on top of the
# generated compose.yaml under its own project name (kb-e2e by default), so it
# runs next to a developer's `kb` stack. Only the gateway, S3 (presigned
# uploads) and Dex (tokens for the test user) are published, on ports outside the defaults; everything else is
# reached through Envoy.
services:
  envoy:
    ports: !override ["${KB_GATEWAY_PORT:-21080}:8080"]
  s3:
    ports: !override ["${KB_E2E_S3_PORT:-21333}:8333"]
  dex:
    ports: !override ["${KB_DEX_PORT:-21556}:5556"]
  web:
    ports: !override ["${KB_WEB_PORT:-21300}:80"]
  postgres:
    ports: !reset []
  nats:
    ports: !reset []
  chat-service:
    ports: !reset []
  document-service:
    ports: !reset []
  ingestion-service:
    ports: !reset []
  llm-service:
    ports: !reset []
