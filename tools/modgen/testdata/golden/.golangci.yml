# Code generated by modgen from modules/*/module.yaml. DO NOT EDIT.
# Edit tools/modgen/templates/golangci.yml.tmpl instead.
version: "2"
linters:
  # standard (errcheck, govet, ineffassign, staticcheck, unused) plus the set
  # agreed in docs/coding-standards.md.
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - misspell
    - noctx
    - nolintlint
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    # Module boundaries (docs/architecture/module.md): a module imports only
    # its own code, platform/ and the api/ of modules in its depends_on;
    # platform/ never imports a module.
    depguard:
      rules:
        platform:
          files: ["**/platform/**"]
          deny:
            - pkg: github.com/christoph/kb/modules
              desc: platform/ must not import modules
        module-notes:
          files: ["**/modules/notes/**"]
          # lax: everything not denied is allowed; the more specific of an
          # allow and a deny entry wins (a dependency's api/ under its denied root).
          list-mode: lax
          deny:
            - pkg: github.com/christoph/kb/modules/search
              desc: search is not in depends_on of notes
        module-search:
          files: ["**/modules/search/**"]
          # lax: everything not denied is allowed; the more specific of an
          # allow and a deny entry wins (a dependency's api/ under its denied root).
          list-mode: lax
          allow:
            - github.com/christoph/kb/modules/notes/api/go
          deny:
            - pkg: github.com/christoph/kb/modules/notes
              desc: only the api/ of a module in depends_on may be imported
    errcheck:
      # Deferred closes of read-side resources have nothing useful to report.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*google.golang.org/grpc.ClientConn).Close
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      kv-only: true
      context: scope
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/christoph/kb]
