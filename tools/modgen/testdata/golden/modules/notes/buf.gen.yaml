# Code generated by modgen from module.yaml. DO NOT EDIT.
# Run from the repository root: buf generate --template modules/notes/buf.gen.yaml
version: v2
clean: true
inputs:
  - directory: .
    paths:
      - modules/notes/proto/kb
plugins:
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-go]
    out: modules/notes/api/go
    opt: [module=github.com/christoph/kb/modules/notes/api/go]
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-go-grpc]
    out: modules/notes/api/go
    opt: [module=github.com/christoph/kb/modules/notes/api/go]
  - local: [uv, run, --quiet, python, tools/protoc-gen-kbpy/main.py]
    out: modules/notes/api/python/src
  - local: node_modules/.bin/protoc-gen-es
    out: modules/notes/api/ts/src
    opt:
      - target=ts
      - rewrite_imports=./kb/common/**/*_pb.js:@kb/common-api
